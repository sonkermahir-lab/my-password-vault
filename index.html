<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Password Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  min-height:100vh;
  color:#fff;
  background:linear-gradient(145deg,#070b12,#101827,#070b12);
}

button,input,textarea{font:inherit}

.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:25px;
  background:rgba(17,25,39,.92);
  border:1px solid #26344b;
  box-shadow:0 25px 80px #0008;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  font-size:32px;
  background:linear-gradient(135deg,#4169ff,#743dff);
}

h1{text-align:center;font-size:25px}
.sub{text-align:center;color:#8490a5;font-size:13px;margin:8px 0 28px}

.field{margin-bottom:16px}

label{
  display:block;
  color:#9da9bb;
  font-size:12px;
  margin-bottom:7px;
}

input,textarea{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #29364b;
  outline:none;
  background:#0a111d;
  color:#fff;
}

input:focus,textarea:focus{border-color:#5272ff}

.btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:12px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#4169ff,#743dff);
}

.error{
  color:#ff8585;
  text-align:center;
  font-size:13px;
  margin-top:13px;
}

/* APP */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#080d16ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #1e293b;
}

.header{
  max-width:1100px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#4169ff,#743dff);
}

.brand small{
  color:#718096;
  font-size:11px;
}

.logout{
  background:#111a29;
  color:#cbd5e1;
  border:1px solid #2a374c;
  border-radius:9px;
  padding:9px 13px;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:22px 18px 50px;
}

.top{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search{flex:1}

.add{
  width:auto;
  padding:0 18px;
  white-space:nowrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  padding:15px;
  border-radius:15px;
  background:#0d1522;
  border:1px solid #202c40;
}

.stat small{color:#738096}
.stat strong{display:block;font-size:21px;margin-top:5px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  padding:18px;
  border-radius:18px;
  background:#0d1522;
  border:1px solid #202c40;
}

.card-title{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.icon{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#17233a;
}

.card h3{font-size:16px}

.row{
  border-top:1px solid #1d293b;
  padding:10px 0;
}

.row-label{
  color:#718096;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.value{
  display:flex;
  gap:8px;
  align-items:center;
  word-break:break-all;
}

.value span{flex:1}

.eye{
  border:0;
  border-radius:7px;
  background:#172238;
  color:#fff;
  padding:7px 9px;
  cursor:pointer;
}

.notes{
  color:#9aa6b8;
  font-size:12px;
  line-height:1.5;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.actions button{
  flex:1;
  padding:9px;
  border-radius:9px;
  cursor:pointer;
  background:#111a29;
  color:#dbe4f2;
  border:1px solid #29374d;
}

.actions .delete{
