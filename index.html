
<!DOCTYPE html>

<style>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login-page">
    <div class="login-card">

        <div class="logo">🔐</div>

        <h1>My Password Vault</h1>
        <p class="subtitle">
            Secure encrypted password storage
        </p>

        <div class="field">
            <label>Master ID</label>
            <input id="masterId" type="text" autocomplete="username"
                   placeholder="Enter Master ID">
        </div>

        <div class="field">
            <label>Master Password</label>
            <input id="masterPassword" type="password"
                   autocomplete="current-password"
                   placeholder="Enter Master Password">
        </div>

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

        <div id="loginMessage" class="message"></div>

    </div>
</section>


<!-- APP -->
<section id="app" class="app hidden">

    <header class="header">
        <div class="header-inner">

            <div class="brand">
                <div class="brand-icon">🔐</div>
                <div>
                    <h2>My Password Vault</h2>
                    <small>Encrypted Cloud Vault</small>
                </div>
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>
    </header>

    <main class="container">

        <div class="topbar">

            <div class="search">
                <input id="searchInput"
                       type="search"
                       placeholder="🔎 Search passwords..."
                       oninput="renderVault()">
            </div>

            <button class="add-btn" onclick="openAddModal()">
                ＋ Add New
            </button>

        </div>

        <div class="stats">

            <div class="stat">
                <small>Total Entries</small>
                <strong id="totalEntries">0</strong>
            </div>

            <div class="stat">
                <small>Encrypted</small>
                <strong>🔒</strong>
            </div>

            <div class="stat">
                <small>Status</small>
                <strong>Online</strong>
            </div>

        </div>

        <div id="vaultGrid" class="grid"></div>

    </main>

</section>


<!-- ADD / EDIT MODAL -->
<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-head">
            <h2 id="modalTitle">Add Password</h2>
            <button class="close" onclick="closeModal()">✕</button>
        </div>

        <div class="field">
            <label>Heading / Service Name</label>
            <input id="entryTitle"
                   placeholder="Example: SBI Bank">
        </div>

        <div class="field">
            <label>Login ID / Username</label>
            <input id="entryLoginId"
                   placeholder="Enter login ID">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="entryPassword"
                   type="password"
                   placeholder="Enter password">
        </div>

        <div class="field">
            <label>MPIN</label>
            <input id="entryMpin"
                   type="password"
                   inputmode="numeric"
                   placeholder="Enter MPIN">
        </div>

        <div class="field">
            <label>Notes</label>
            <textarea id="entryNotes"
                      rows="3"
                      placeholder="Optional notes"></textarea>
        </div>

        <div class="modal-actions">

            <button class="cancel-btn"
                    onclick="closeModal()">
                Cancel
            </button>

            <button class="save-btn"
                    onclick="saveEntry()">
                Save Securely
            </button>

        </div>

    </div>

</div>


<div id="toast" class="toast hidden"></div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_PUBLISHABLE_KEY =
"YOUR_SUPABASE_PUBLISHABLE_KEY";

/*
   IMPORTANT:
   This is only your visible Master ID.
   DO NOT put your Master Password here.
*/
const MASTER_ID = "maanu";


/* Supabase client */

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let vault = [];
let editingIndex = -1;

/*
   Encryption key is kept only in memory.

   It disappears when the page is closed/logged out.
*/
let encryptionKey = null;


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

    const id =
        document.getElementById("masterId").value.trim();

    const password =
        document.getElementById("masterPassword").value;

    const msg =
        document.getElementById("loginMessage");

    msg.textContent = "";

    if(!id || !password){

        msg.textContent =
            "Please enter Master ID and Password.";

        return;
    }

    if(id !== MASTER_ID){

        msg.textContent =
            "Invalid Master ID.";

        return;
    }

    if(
        SUPABASE_URL.includes("YOUR_") ||
        SUPABASE_PUBLISHABLE_KEY.includes("YOUR_")
    ){

        msg.textContent =
            "Please configure Supabase settings in index.html.";

        return;
    }

    try{

        /*
           Your Supabase Auth user is the email/password
           account you created in Supabase.
        */

        const email = prompt(
            "Enter your Supabase login email:"
        );

        if(!email){

            msg.textContent =
                "Login cancelled.";

            return;
        }

        const { data, error } =
            await db.auth.signInWithPassword({
                email: email.trim(),
                password: password
            });

        if(error){

            console.error(error);

            msg.textContent =
                "Login failed: " + error.message;

            return;
        }

        /*
           Derive encryption key from Master Password.
        */

        encryptionKey =
            await deriveKey(password);

        document.getElementById("loginPage")
            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

        await loadVault();

        /*
           Clear password input.
        */

        document.getElementById("masterPassword").value = "";

    }catch(error){

        console.error(error);

        msg.textContent =
            "Something went wrong.";

    }
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

    await db.auth.signOut();

    vault = [];
    encryptionKey = null;

    document.getElementById("app")
        .classList.add("hidden");

    document.getElementById("loginPage")
        .classList.remove("hidden");

    document.getElementById("masterId").value = "";
    document.getElementById("masterPassword").value = "";

    renderVault();
}


/* =========================================================
   PASSWORD -> ENCRYPTION KEY
   ========================================================= */

async function deriveKey(password){

    const encoder =
        new TextEncoder();

    const passwordBytes =
        encoder.encode(password);

    /*
       PBKDF2 makes the password-derived key
       much harder to brute force.
    */

    const baseKey =
        await crypto.subtle.importKey(
            "raw",
            passwordBytes,
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    /*
       Fixed salt is used so another device can
       derive the same key from the same password.

       The actual vault remains encrypted.
    */

    const salt =
        encoder.encode(
            "my-password-vault-v1"
        );

    return await crypto.subtle.deriveKey(
        {
            name:"PBKDF2",
            salt:salt,
            iterations:250000,
            hash:"SHA-256"
        },
        baseKey,
        {
            name:"AES-GCM",
            length:256
        },
        false,
        ["encrypt","decrypt"]
    );
}


/* =========================================================
   ENCRYPT
   ========================================================= */

async function encryptData(data){

    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );

    const encoded =
        new TextEncoder().encode(
            JSON.stringify(data)
        );

    const encrypted =
        await crypto.subtle.encrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            encryptionKey,
            encoded
        );

    return JSON.stringify({

        iv:arrayToBase64(iv),

        data:arrayToBase64(
            new Uint8Array(encrypted)
        )

    });
}


/* =========================================================
   DECRYPT
   ========================================================= */

async function decryptData(payload){

    const parsed =
        JSON.parse(payload);

    const iv =
        base64ToArray(parsed.iv);

    const encrypted =
        base64ToArray(parsed.data);

    const decrypted =
        await crypto.subtle.decrypt(
            {
                name:"AES-GCM",
                iv:iv
            },
            encryptionKey,
            encrypted
        );

    return JSON.parse(
        new TextDecoder().decode(decrypted)
    );
}


/* =========================================================
   BASE64 HELPERS
   ========================================================= */

function arrayToBase64(bytes){

    let binary = "";

    bytes.forEach(
        byte => binary +=
            String.fromCharCode(byte)
    );

    return btoa(binary);
}


function base64ToArray(base64){

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(binary.length);

    for(let i=0;i<binary.length;i++){

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}


/* =========================================================
   LOAD VAULT
   ========================================================= */

async function loadVault(){

    try{

        const {
            data:userData
        } = await db.auth.getUser();

        const user =
            userData.user;

        if(!user){

            throw new Error(
                "User session not found."
            );
        }

        const { data, error } =
            await db
                .from("vault_entries")
                .select("id, encrypted_data")
                .eq("user_id", user.id)
                .maybeSingle();

        if(error){

            console.error(error);

            showToast(
                "Could not load vault."
            );

            return;
        }

        if(!data){

            vault = [];

            renderVault();

            return;
        }

        try{

            vault =
                await decryptData(
                    data.encrypted_data
                );

            if(!Array.isArray(vault)){

                vault = [];

            }

        }catch(error){

            console.error(error);

            showToast(
                "Unable to decrypt vault. Check password."
            );

            vault = [];

        }

        renderVault();

    }catch(error){

        console.error(error);

        showToast(
            "Failed to load vault."
        );
    }
}


/* =========================================================
   SAVE WHOLE VAULT
   ========================================================= */

async function saveVault(){

    try{

        const {
            data:userData
        } = await db.auth.getUser();

        const user =
            userData.user;

        if(!user){

            throw new Error(
                "Not authenticated."
            );
        }

        const encrypted =
            await encryptData(vault);

        /*
           Check if user's row already exists.
        */

        const {
            data:existing,
            error:findError
        } = await db
            .from("vault_entries")
            .select("id")
            .eq("user_id", user.id)
            .maybeSingle();

        if(findError){

            throw findError;
        }

        if(existing){

            const { error } =
                await db
                    .from("vault_entries")
                    .update({
                        encrypted_data:encrypted
                    })
                    .eq("id", existing.id)
                    .eq("user_id", user.id);

            if(error){

                throw error;
            }

        }else{

            const { error } =
                await db
                    .from("vault_entries")
                    .insert({
                        user_id:user.id,
                        encrypted_data:encrypted
                    });

            if(error){

                throw error;
            }
        }

        showToast(
            "Saved securely 🔒"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Save failed: " + error.message
        );

    }
}


/* =========================================================
   ADD MODAL
   ========================================================= */

function openAddModal(){

    editingIndex = -1;

    document.getElementById("modalTitle")
        .textContent = "Add Password";

    document.getElementById("entryTitle").value = "";
    document.getElementById("entryLoginId").value = "";
    document.getElementById("entryPassword").value = "";
    document.getElementById("entryMpin").value = "";
    document.getElementById("entryNotes").value = "";

    document.getElementById("modal")
        .classList.remove("hidden");
}


function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");
}


/* =========================================================
   SAVE ENTRY
   ========================================================= */

async function saveEntry(){

    const title =
        document.getElementById("entryTitle")
            .value.trim();

    const loginId =
        document.getElementById("entryLoginId")
            .value.trim();

    const password =
        document.getElementById("entryPassword")
            .value;

    const mpin =
        document.getElementById("entryMpin")
            .value;

    const notes =
        document.getElementById("entryNotes")
            .value.trim();


    if(!title){

        showToast(
            "Heading is required."
        );

        return;
    }

    if(!loginId && !password && !mpin){

        showToast(
            "Enter at least one credential."
        );

        return;
    }


    const entry = {

        title:title,

        loginId:loginId,

        password:password,

        mpin:mpin,

        notes:notes,

        updatedAt:
            new Date().toISOString()

    };


    if(editingIndex === -1){

        vault.unshift(entry);

    }else{

        vault[editingIndex] = entry;

    }


    await saveVault();

    closeModal();

    renderVault();
}


/* =========================================================
   EDIT
   ========================================================= */

function editEntry(index){

    const entry =
        vault[index];

    editingIndex = index;

    document.getElementById("modalTitle")
        .textContent = "Edit Password";

    document.getElementById("entryTitle")
        .value = entry.title || "";

    document.getElementById("entryLoginId")
        .value = entry.loginId || "";

    document.getElementById("entryPassword")
        .value = entry.password || "";

    document.getElementById("entryMpin")
        .value = entry.mpin || "";

    document.getElementById("entryNotes")
        .value = entry.notes || "";

    document.getElementById("modal")
        .classList.remove("hidden");
}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteEntry(index){

    const entry =
        vault[index];

    if(!confirm(
        `Delete "${entry.title}"?`
    )){

        return;
    }

    vault.splice(index,1);

    await saveVault();

    renderVault();
}


/* =========================================================
   SHOW / HIDE VALUE
   ========================================================= */

function toggleValue(button){

    const value =
        button.parentElement
            .querySelector(".value-text");

    const hidden =
        value.dataset.hidden === "true";

    if(hidden){

        value.textContent =
            value.dataset.value;

        value.dataset.hidden =
            "false";

        button.textContent = "🙈";

    }else{

        value.textContent =
            "••••••••";

        value.dataset.hidden =
            "true";

        button.textContent = "👁";
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderVault(){

    const grid =
        document.getElementById("vaultGrid");

    const search =
        document.getElementById("searchInput")
            ?.value
            .toLowerCase()
            .trim() || "";

    const filtered =
        vault.filter(entry => {

            return (
                (entry.title || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (entry.loginId || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (entry.notes || "")
                    .toLowerCase()
                    .includes(search)
            );
        });


    document.getElementById("totalEntries")
        .textContent = vault.length;


    if(filtered.length === 0){

        grid.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div style="font-size:42px;margin-bottom:12px">
                    🔐
                </div>
                <div>
                    ${
                        vault.length === 0
                        ? "No passwords saved yet."
                        : "No matching passwords."
                    }
                </div>
            </div>
        `;

        return;
    }


    grid.innerHTML =
        filtered.map(entry => {

            const originalIndex =
                vault.indexOf(entry);

            return createCard(
                entry,
                originalIndex
            );

        }).join("");
}


/* =========================================================
   CARD
   ========================================================= */

function createCard(entry,index){

    const title =
        escapeHtml(
            entry.title || "Untitled"
        );

    const loginId =
        escapeHtml(
            entry.loginId || ""
        );

    const password =
        escapeHtml(
            entry.password || ""
        );

    const mpin =
        escapeHtml(
            entry.mpin || ""
        );

    const notes =
        escapeHtml(
            entry.notes || ""
        );


    return `

        <div class="card">

            <div class="card-head">

                <div class="card-title">

                    <div class="card-icon">
                        🔐
                    </div>

                    <div>
                        <h3>${title}</h3>

                        <div class="card-date">
                            ${formatDate(entry.updatedAt)}
                        </div>
                    </div>

                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Login ID
                </div>

                <div class="data-value">

                    <span class="value-text"
                          data-value="${loginId}"
                          data-hidden="false">
                        ${loginId || "—"}
                    </span>

                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Password
                </div>

                <div class="data-value">

                    <span class="value-text"
                          data-value="${password}"
                          data-hidden="true">
                        ••••••••
                    </span>

                    <button class="eye"
                            onclick="toggleValue(this)">
                        👁
                    </button>

                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    MPIN
                </div>

                <div class="data-value">

                    <span class="value-text"
                          data-value="${mpin}"
                          data-hidden="true">
                        ••••
                    </span>

                    <button class="eye"
                            onclick="toggleValue(this)">
                        👁
                    </button>

                </div>

            </div>


            ${
                notes
                ?
                `
                <div class="data-row">

                    <div class="data-label">
                        Notes
                    </div>

                    <div class="notes">
                        ${notes}
                    </div>

                </div>
                `
                :
                ""
            }


            <div class="actions">

                <button class="edit-btn"
                        onclick="editEntry(${index})">
                    ✏️ Edit
                </button>

                <button class="delete-btn"
                        onclick="deleteEntry(${index})">
                    🗑️ Delete
                </button>

            </div>

        </div>
    `;
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(date){

    if(!date){
        return "";
    }

    try{

        return new Date(date)
            .toLocaleString(
                "en-IN",
                {
                    day:"2-digit",
                    month:"short",
                    year:"numeric"
                }
            );

    }catch{

        return "";
    }
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.remove(
        "hidden"
    );

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.add(
                "hidden"
            );

        },3000);
}


/* =========================================================
   ENTER KEY LOGIN
   ========================================================= */

document
    .getElementById("masterPassword")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                login();

            }

        }
    );

</script>
